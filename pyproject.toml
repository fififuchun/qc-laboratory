[project]
name = "qc-laboratory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pylatexenc>=2.11",
    "qiskit>=2.6.2",
    "qiskit-aer>=0.18.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
